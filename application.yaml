apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: allops1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EA-AllOps/allops-argocd.git
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true